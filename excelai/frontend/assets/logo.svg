<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56" role="img" aria-label="ExcelLence logo">
  <!-- 3x3 grid icon -->
  <g transform="translate(0,4)">
    <rect x="4" y="4" width="40" height="40" rx="4" fill="#F9FAFB" stroke="#E1E4E8" />
    <g transform="translate(8,8)">
      <rect x="0" y="0" width="10" height="10" fill="#E8F5EC" stroke="#C6E3CE" />
      <rect x="12" y="0" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />
      <rect x="24" y="0" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />

      <rect x="0" y="12" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />
      <rect x="12" y="12" width="10" height="10" fill="#1D7D3A" stroke="#155C2B" />
      <rect x="24" y="12" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />

      <rect x="0" y="24" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />
      <rect x="12" y="24" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />
      <rect x="24" y="24" width="10" height="10" fill="#F9FAFB" stroke="#E1E4E8" />
    </g>
  </g>

  <!-- Wordmark -->
  <text x="64" y="34" font-family="Nunito, Inter, sans-serif" font-weight="700" font-size="20" fill="#1A1D23">Excel</text>
  <text x="112" y="34" font-family="Nunito, Inter, sans-serif" font-weight="700" font-size="20" fill="#1D7D3A">Lence</text>
</svg>
